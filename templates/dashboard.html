<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportPilot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
    body {
        background: #f4f6f9;
    }

    .main-card {
        border-radius: 15px;
        height: 100%;
    }

    .kpi {
        font-size: 2.2rem;
        font-weight: 700;
    }

    .chart-container {
        position: relative;
        height: 300px;
        width: 100%;
    }

    .chart-container canvas {
        max-width: 100%;
    }
</style>


</head>
<body>
<div class="container mt-4 mb-5">

    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary">SupportPilot Dashboard</h1>
        <p>Live overview of all IT support tickets</p>
        <a href="/" class="btn btn-outline-primary btn-sm me-1">Submit Ticket</a>
        <a href="/dashboard" class="btn btn-primary btn-sm">Dashboard</a>
    </div>

    <!-- KPI cards -->
    <div class="row g-3 mb-4 text-center">
        <div class="col-6 col-md-3"><div class="card shadow main-card p-3">
            <div class="text-muted">Total Tickets</div><div class="kpi text-primary" id="k-total">0</div></div></div>
        <div class="col-6 col-md-3"><div class="card shadow main-card p-3">
            <div class="text-muted">Open Tickets</div><div class="kpi text-success" id="k-open">0</div></div></div>
        <div class="col-6 col-md-3"><div class="card shadow main-card p-3">
            <div class="text-muted">P1 - Urgent</div><div class="kpi text-danger" id="k-p1">0</div></div></div>
        <div class="col-6 col-md-3"><div class="card shadow main-card p-3">
            <div class="text-muted">P2 - High</div><div class="kpi text-warning" id="k-p2">0</div></div></div>
    </div>

    <!-- Charts -->
    <!-- Charts -->
<div class="row g-3 mb-4">

    <!-- Category Chart -->
    <div class="col-md-6">
        <div class="card shadow main-card p-3">
            <h5>Tickets by Category</h5>
            <div class="chart-container">
                <canvas id="catChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Severity Chart -->
    <div class="col-md-6">
        <div class="card shadow main-card p-3">
            <h5>Tickets by Severity</h5>
            <div class="chart-container">
                <div style="height:300px; width:100%; position:relative;">
    <canvas id="sevChart"></canvas>
</div>
                
            </div>
        </div>
    </div>

    <!-- Priority Chart -->
    <div class="col-md-6">
        <div class="card shadow main-card p-3">
            <h5>Tickets by Priority</h5>
            <div class="chart-container">
                <canvas id="priChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Recent Tickets -->
    <div class="col-md-6">
        <div class="card shadow main-card p-3">
            <h5>Recent Tickets</h5>

            <div class="table-responsive">
                <table class="table table-sm table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Priority</th>
                        </tr>
                    </thead>

                    <tbody id="recent"></tbody>
                </table>
            </div>

            <p id="empty" class="text-muted d-none">
                No tickets submitted yet.
            </p>
        </div>
    </div>

</div>

<script>
const SEV_COLORS = {Critical: "#dc3545", High: "#fd7e14", Medium: "#ffc107", Low: "#198754"};
const PRI_ORDER = ["P1 - Urgent", "P2 - High", "P3 - Medium", "P4 - Low"];
const SEV_ORDER = ["Critical", "High", "Medium", "Low"];
const PALETTE = ["#0d6efd", "#6610f2", "#20c997", "#d63384", "#0dcaf0", "#6c757d"];
const charts = {};

function esc(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
}
function draw(id, type, labels, values, colors, showLegend) {

    if (charts[id]) {
        charts[id].destroy();
    }

    charts[id] = new Chart(document.getElementById(id), {

        type: type,

        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: colors
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: {
                    display: showLegend,
                    position: "top"
                }
            },

            scales: type === "bar" ? {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            } : {}
        }
    });
}

async function refresh() {
    const res = await fetch("/api/stats");
    const s = await res.json();

    document.getElementById("k-total").textContent = s.total;
    document.getElementById("k-open").textContent = s.by_status["Open"] || 0;
    document.getElementById("k-p1").textContent = s.by_priority["P1 - Urgent"] || 0;
    document.getElementById("k-p2").textContent = s.by_priority["P2 - High"] || 0;

    const cats = Object.keys(s.by_category);
    draw("catChart", "bar", cats, cats.map(c => s.by_category[c]),
         cats.map((c, i) => PALETTE[i % PALETTE.length]), false);

    const sevs = SEV_ORDER.filter(x => s.by_severity[x]);
    if (charts["sevChart"]) {
    charts["sevChart"].destroy();
}

charts["sevChart"] = new Chart(document.getElementById("sevChart"), {
    type: "doughnut",
    data: {
        labels: sevs,
        datasets: [{
            data: sevs.map(x => s.by_severity[x]),
            backgroundColor: sevs.map(x => SEV_COLORS[x])
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        aspectRatio: 1,
        plugins: {
            legend: {
                display: true,
                position: "top"
            }
        }
    }
});

    const pris = PRI_ORDER.filter(x => s.by_priority[x]);
    const PRI_COLORS = {
    "P1 - Urgent": "#dc3545",
    "P2 - High": "#fd7e14",
    "P3 - Medium": "#ffc107",
    "P4 - Low": "#198754"
};

draw(
    "priChart",
    "bar",
    pris,
    pris.map(x => s.by_priority[x]),
    pris.map(x => PRI_COLORS[x]),
    false
);
    

    document.getElementById("recent").innerHTML = s.recent.map(t =>
        `<tr><td>${t.id}</td><td>${esc(t.name)}</td><td>${esc(t.category)}</td><td>${esc(t.priority)}</td></tr>`
    ).join("");
    document.getElementById("empty").classList.toggle("d-none", s.total > 0);
}
refresh();
setInterval(refresh, 10000);
</script>
<script>
function updateActiveMenu() {
    const currentHash = window.location.hash || "#home";

    document.querySelectorAll(".sidebar a").forEach(link => {
        link.classList.remove("active");

        if (link.getAttribute("href") === currentHash) {
            link.classList.add("active");
        }
    });
}
window.addEventListener("hashchange", updateActiveMenu);
window.addEventListener("load", updateActiveMenu);
</script>
</body>
</html>
